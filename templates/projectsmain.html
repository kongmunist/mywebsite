{% extends "base.html" %}

{% block app_content %}
<style>
    .hovereffect {
  display: block;
  width: 100%;
  height: 90%;
  float: center;
  overflow: hidden;
  position: relative;
  text-align: center;
  cursor: pointer;
}

.hovereffect,
.hovereffect:hover {
  text-decoration: none;
}

.hovereffect .overlay {
  width: 100%;
  height: 93%;
  position: absolute;
  overflow: hidden;
  top: 7%;
  left: 0;
  -webkit-transition: all 0.4s ease-in-out;
  transition: all 0.4s ease-in-out;
}

.hovereffect:hover .overlay,
.hovereffect:focus-visible .overlay {
  background-color: rgba(0, 180, 196, 0.6);
}

.hovereffect img {
  display: flex;
  position: relative;
}

.hovereffect h2 {
  color: #fff;
  text-align: center;
  overflow: hidden;
  position: relative;
  font-size: 17px;
  padding: 10px;
  background: rgba(0, 0, 0, 0.6);
  -webkit-transform: translateY(45px);
  -ms-transform: translateY(100px);
  transform: translateY(45px);
  -webkit-transition: all 0.4s ease-in-out;
  transition: all 0.4s ease-in-out;
}

.hovereffect:hover h2,
.hovereffect:focus-visible h2 {
  -webkit-transform: translateY(5px);
  -ms-transform: translateY(5px);
  transform: translateY(5px);
}

.hovereffect .info {
  display: inline-block;
  text-decoration: none;
  padding: 7px 14px;
  color: #fff;
  border: 1px solid #fff;
  background-color: #000;
  opacity: 0;
  filter: alpha(opacity=0);
  -webkit-transform: scale(0);
  -ms-transform: scale(0);
  transform: scale(0);
  -webkit-transition: all 0.4s ease-in-out;
  transition: all 0.4s ease-in-out;
  font-weight: normal;
}

.hovereffect:hover .info,
.hovereffect:focus-visible .info {
  opacity: 1;
  filter: alpha(opacity=100);
  -webkit-transform: scale(1);
  -ms-transform: scale(1);
  transform: scale(1);
}

.hovereffect:focus-visible {
  outline: 3px solid #00DFFC;
  outline-offset: 3px;
}
</style>
<h1 class="text-center"> Projects</h1>

<div class="container-fluid" style="height: 100%;">
    <div class="row" >


        {% for p in pages %}

        <div class="col-xl-3 col-lg-4 col-md-4 col-sm-6 col-xs-12">
    <a class="hovereffect" href="{{ url_for('project', project=p.path[9:]) }}" aria-label="{{ p.title }}: {{ p.description }}">
<!--    using jinja conditionals, if p.pic has a .mov or .mp4 ending, we use a video instead    -->
        {% if p.pic.endswith(".mov") or p.pic.endswith(".mp4") %}
        <video class="img mx-auto d-block" src="{{ url_for("static", filename= p.pic) }}" height="400vw" loading="lazy" autoplay muted loop playsinline>
        </video>
        {% else %}
        <img class="img mx-auto d-block" src="{{ url_for("static", filename= p.pic) }}" height="400vw" loading="lazy">
        {% endif %}

        <div class="overlay">
           <h2>{{ p.title }}</h2>
           <span class="info">{{ p.description }}</span>
        </div>
    </a>
    </div>

<!--        <br>-->



        {% endfor %}
    </div>
</div>
{% endblock %}
